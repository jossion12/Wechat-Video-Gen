# deploy/nginx.conf — 前端静态资源 + API 反代(SSE 必须关闭缓冲)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 允许最大上传体积(默认 1MB,这里放宽到 10MB)
    # 想再大就改这个值,单位 m=Megabytes,也可以用纯数字表示字节
    client_max_body_size 10m;
    client_body_timeout 60s;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查(同时暴露给 :8080)
    location = /health {
        proxy_pass http://backend:8000;
    }

    # API 反代
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;           # SSE 必须
        proxy_cache off;               # SSE 必须
        proxy_read_timeout 86400;      # SSE 长连接
    }

    # 上传/产物静态文件
    location /uploads/ { proxy_pass http://backend:8000; }
    location /outputs/ { proxy_pass http://backend:8000; }
}
