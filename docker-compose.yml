services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: dialogue-theater
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage      # 持久化上传与产物
    environment:
      - WORKER_COUNT=2
      - LOG_LEVEL=info
      - MAX_UPLOAD_SIZE=10485760   # 10MB,和前端 nginx 上限对齐
      - AUTH_REQUIRED=false         # 生产必须 true;本地 dev 改 false
      # - BASE_URL=http://localhost:8000  # 上传资源转绝对 URL;部署到域名时修改
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: dialogue-theater-web
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
