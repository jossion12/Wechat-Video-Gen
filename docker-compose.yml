services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: dialogue-theater
    ports:
      - "8000:8000"
    # 注:原 2025-Q3 版本(回退 Qwen3-TTS 之前)启用了 nvidia runtime 透传 GPU 给容器;
    # 当前版本不需要,以下 7 行注释保留,恢复时取消注释即可。
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ./storage:/app/storage      # 持久化上传与产物
      # TTS 模型目录(2025-Q3):宿主 D:\model\modelscope → 容器 /d/model/modelscope → 容器内 /app/tts-models。
      # 配合 .env 里 TTS_MODEL_PATH=/app/tts-models/Qwen3-TTS-12Hz-1.7B-CustomVoice。
      # 当前版本(回退 Qwen3-TTS)不需要,以下 mount 行注释保留,恢复时取消注释即可。
      # - /d/model/modelscope:/app/tts-models:ro
    environment:
      - WORKER_COUNT=${WORKER_COUNT:-2}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}   # 10MB,与后端默认一致;importer 复用此值作为 zip 内单文件上限
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}          # 生产必须 true;本地 dev 改 false
      - BASE_URL=${BASE_URL:-http://localhost:8000}    # 上传资源转绝对 URL;部署到域名时修改
      - IMPORT_MAX_ZIP_SIZE=${IMPORT_MAX_ZIP_SIZE:-209715200}       # zip 本体上限(默认 200MB)
      - IMPORT_MAX_UNPACKED_SIZE=${IMPORT_MAX_UNPACKED_SIZE:-524288000}  # 解压后总上限(默认 500MB)
      # AI 辅助生成配置:从 .env 读取,不提交密钥到仓库
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-4096}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.8}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-50}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-60}
      # TTS 多角色对话合成(2025-Q3,见 docs/Qwen3-TTS_MultiSpeaker_Dialogue_Guide.md)。
      # TTS_MODEL_PATH 必须在 .env 里指向本地模型绝对路径,Docker 内需 mount 进容器(见 volumes)。
      # 当前版本(回退 Qwen3-TTS)不需要,以下 9 行环境变量全部注释保留,恢复时取消注释即可。
      # - TTS_ENABLED=${TTS_ENABLED:-true}
      # - TTS_MODEL_PATH=${TTS_MODEL_PATH:-}
      # - TTS_DEVICE=${TTS_DEVICE:-cuda:0}
      # - TTS_DTYPE=${TTS_DTYPE:-bfloat16}
      # - TTS_TARGET_SR=${TTS_TARGET_SR:-24000}
      # - TTS_VOICE_CONFIG=${TTS_VOICE_CONFIG:-backend/config/tts_voices.json}
      # - TTS_LANGUAGE=${TTS_LANGUAGE:-Chinese}
      # - TTS_INFERENCE_TIMEOUT_S=${TTS_INFERENCE_TIMEOUT_S:-120}
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: dialogue-theater-web
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
